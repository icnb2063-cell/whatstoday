<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 반 오늘의 안내판 (관리자 기능 포함)</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #eef7ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .dashboard {
            background-color: #ffffff;
            width: 90%;
            max-width: 600px;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
            text-align: center;
            border: 5px solid #bcdffd;
            margin-bottom: 20px;
        }
        h1 {
            color: #2c3e50;
            font-size: 2rem;
            margin-bottom: 5px;
        }
        .date-display {
            font-size: 1.3rem;
            color: #7f8c8d;
            margin-bottom: 25px;
            font-weight: bold;
        }
        .card {
            background-color: #f8f9fa;
            padding: 20px;
            margin: 15px 0;
            border-radius: 15px;
            border-left: 8px solid #3498db;
        }
        .card-title {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 10px;
        }
        .card-value {
            font-size: 2.2rem;
            font-weight: bold;
        }
        /* 모둠별 색상 */
        .color-빨강 { color: #e74c3c; }
        .color-노랑 { color: #f1c40f; text-shadow: 1px 1px 1px #999; }
        .color-초록 { color: #2ecc71; }
        .color-파랑 { color: #3498db; }
        .color-보라 { color: #9b59b6; }
        
        /* 급식 순서 */
        .gender-남자 { color: #2980b9; }
        .gender-여자 { color: #e84393; }
        
        /* 쉬는 날 메시지 */
        .holiday-msg {
            color: #e67e22;
            font-size: 1.8rem;
            font-weight: bold;
            padding: 40px 0;
        }

        /* ⚙️ 선생님용 설정창 스타일 */
        .admin-panel {
            background-color: #34495e;
            color: white;
            width: 90%;
            max-width: 600px;
            padding: 20px;
            border-radius: 15px;
            box-sizing: border-box;
        }
        .admin-panel h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-content {
            display: none; /* 기본적으로는 접어둠 */
        }
        .admin-content.active {
            display: block;
        }
        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #bdc3c7;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: none;
            box-sizing: border-box;
            font-size: 0.9rem;
        }
        .form-group textarea {
            height: 60px;
            resize: none;
            font-family: monospace;
        }
        .btn-apply {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .btn-apply:hover { background-color: #27ae60; }
        .hint { font-size: 0.8rem; color: #95a5a6; margin-top: 3px; }
        
        /* 오늘로 변경 버튼 스타일 */
        .btn-today {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .btn-today:hover { background-color: #c0392b; }

        .row-flex {
            display: flex;
            gap: 10px;
        }
        .row-flex > div {
            flex: 1;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <h1>🎒 우리 반 오늘의 안내판</h1>
        <div id="current-date" class="date-display">0000년 00월 00일 (요일)</div>

        <div id="school-day-content">
            <div class="card" style="border-left-color: #ff9f43;">
                <div class="card-title">⭐ 오늘의 주인공 모둠</div>
                <div id="today-team" class="card-value">-</div>
            </div>

            <div class="card" style="border-left-color: #1dd1a1;">
                <div class="card-title">🍴 오늘의 급식 먼저 먹는 순서</div>
                <div id="lunch-order" class="card-value">-</div>
            </div>
        </div>

        <div id="holiday-content" class="holiday-msg" style="display: none;">
            <span id="holiday-text">🏡 오늘은 즐거운 쉬는 날입니다!</span>
        </div>
    </div>

    <div class="admin-panel">
        <h2 onclick="handleAdminToggle()">⚙️ [선생님용] 안내판 비밀 설정 관리 <span id="arrow">▼</span></h2>
        
        <div id="admin-content" class="admin-content">
            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                    <label for="custom-date" style="margin: 0;">📆 기준 날짜 선택 (미지정 시 오늘 날짜 자동으로 반영)</label>
                    <button type="button" class="btn-today" onclick="resetToToday()">오늘로 변경</button>
                </div>
                <input type="date" id="custom-date" onchange="updateDashboard()">
            </div>

            <div class="form-group row-flex">
                <div>
                    <label for="manual-team">⭐ 오늘의 모둠 직접 수동 지정</label>
                    <select id="manual-team" onchange="updateDashboard()">
                        <option value="auto">🔄 자동 로테이션 계산</option>
                        <option value="빨강 모둠">🔴 빨강 모둠</option>
                        <option value="노랑 모둠">🟡 노랑 모둠</option>
                        <option value="초록 모둠">🟢 초록 모둠</option>
                        <option value="파랑 모둠">🔵 파랑 모둠</option>
                        <option value="보라 모둠">🟣 보라 모둠</option>
                    </select>
                </div>
                <div>
                    <label for="manual-lunch">🍴 급식 순서 직접 수동 지정</label>
                    <select id="manual-lunch" onchange="updateDashboard()">
                        <option value="auto">🔄 자동 로테이션 계산</option>
                        <option value="남자 먼저 👦">👦 남자 먼저</option>
                        <option value="여자 먼저 👧">👧 여자 먼저</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="holiday-list">🛑 휴업일 지정 (한 줄에 하나씩 yyyy-mm-dd:사유 형식으로 입력)</label>
                <textarea id="holiday-list" placeholder="예시)&#10;2026-05-05:어린이날 쉬는날!&#10;2026-06-05:우리학교 개교기념일"></textarea>
            </div>

            <div class="form-group">
                <label>🏖️ 방학 기간 지정 (시작일과 종료일 입력)</label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="date" id="vacation-start"> 부터 
                    <input type="date" id="vacation-end"> 까지
                </div>
                <div class="hint">* 종료일 다음날이 자동으로 '개학일'이 됩니다.</div>
            </div>

            <button class="btn-apply" onclick="updateDashboard()">설정 저장 및 적용하기</button>
        </div>
    </div>

    <script>
        // 초기 기본 데이터 셋팅
        document.getElementById('holiday-list').value = "2026-05-05:어린이날 🎈\n2026-06-05:개교기념일 🎉\n2026-10-03:개천절 🇰🇷";
        document.getElementById('vacation-start').value = "2026-07-25";
        document.getElementById('vacation-end').value = "2026-08-23";

        let isAdminAuthenticated = false; // 인증 상태 변수

        // 비밀번호 체크 및 패널 토글 제어
        function handleAdminToggle() {
            const content = document.getElementById('admin-content');
            
            if (content.classList.contains('active')) {
                toggleAdminPanel(false);
                return;
            }

            if (!isAdminAuthenticated) {
                const password = prompt("선생님 비밀번호를 입력하세요:");
                if (password === "6435") {
                    isAdminAuthenticated = true; 
                    toggleAdminPanel(true);
                } else if (password !== null) {
                    alert("비밀번호가 올바르지 않습니다! ❌");
                }
            } else {
                toggleAdminPanel(true);
            }
        }

        function toggleAdminPanel(isOpen) {
            const content = document.getElementById('admin-content');
            const arrow = document.getElementById('arrow');
            if (isOpen) {
                content.classList.add('active');
                arrow.innerText = "▲";
            } else {
                content.classList.remove('active');
                arrow.innerText = "▼";
            }
        }

        function resetToToday() {
            document.getElementById('custom-date').value = "";
            updateDashboard();
        }

        function formatDateStr(d) {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const date = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${date}`;
        }

        // 휴일 상태 검사기
        function checkHolidayStatus(dateObj, vacStart, vacEnd, holidayMap) {
            const dayIdx = dateObj.getDay();
            const dateStr = formatDateStr(dateObj);

            if (dayIdx === 0 || dayIdx === 6) {
                return { isHoliday: true, reason: "🏡 오늘은 신나는 주말입니다!" };
            }
            if (vacStart && vacEnd && dateStr >= vacStart && dateStr <= vacEnd) {
                return { isHoliday: true, reason: "🏖️ 즐거운 방학 기간입니다! 🏖️" };
            }
            if (vacEnd) {
                const nextDay = new Date(vacEnd + "T00:00:00");
                nextDay.setDate(nextDay.getDate() + 1);
                if (dateStr === formatDateStr(nextDay)) {
                    return { isHoliday: true, reason: "🎒 오늘은 2학기 개학일입니다! 반갑게 만나요!" };
                }
            }
            if (holidayMap[dateStr]) {
                return { isHoliday: true, reason: `🛑 오늘은 ${holidayMap[dateStr]} 입니다.` };
            }
            return { isHoliday: false, reason: "" };
        }

        // 메인 대시보드 업데이트 함수
        function updateDashboard() {
            let targetDate;
            const customDateValue = document.getElementById('custom-date').value;

            if (customDateValue) {
                targetDate = new Date(customDateValue + "T00:00:00");
            } else {
                const now = new Date();
                const kstOffset = 9 * 60 * 60 * 1000;
                const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
                targetDate = new Date(utc + kstOffset);
                targetDate.setHours(0,0,0,0);
            }

            const weekDays = ['일', '월', '화', '수', '목', '금', '토'];
            document.getElementById('current-date').innerText = 
                `${targetDate.getFullYear()}년 ${String(targetDate.getMonth() + 1).padStart(2, '0')}월 ${String(targetDate.getDate()).padStart(2, '0')}일 (${weekDays[targetDate.getDay()]}요일)`;

            const vacStart = document.getElementById('vacation-start').value;
            const vacEnd = document.getElementById('vacation-end').value;
            
            const holidayMap = {};
            const lines = document.getElementById('holiday-list').value.split('\n');
            for (let line of lines) {
                if (line.includes(':')) {
                    const [hDate, hName] = line.split(':');
                    holidayMap[hDate.trim()] = hName.trim();
                }
            }

            const currentStatus = checkHolidayStatus(targetDate, vacStart, vacEnd, holidayMap);

            if (currentStatus.isHoliday) {
                document.getElementById('school-day-content').style.display = 'none';
                document.getElementById('holiday-content').style.display = 'block';
                document.getElementById('holiday-text').innerText = currentStatus.reason;
                return;
            }

            document.getElementById('school-day-content').style.display = 'block';
            document.getElementById('holiday-content').style.display = 'none';

            const manualTeamValue = document.getElementById('manual-team').value;
            const manualLunchValue = document.getElementById('manual-lunch').value;

            let currentTeam = "";
            let currentLunch = "";

            if (manualTeamValue !== "auto") {
                currentTeam = manualTeamValue;
            }
            if (manualLunchValue !== "auto") {
                currentLunch = manualLunchValue;
            }

            // 자동 계산 처리를 위한 로직 수정
            if (manualTeamValue === "auto" || manualLunchValue === "auto") {
                // 🛠️ 변동 사항: 기준점을 요청하신 2026년 6월 4일(목)로 변경
                const baseDate = new Date("2026-06-04T00:00:00");
                let schoolDaysCount = 0;

                if (targetDate >= baseDate) {
                    let loopDate = new Date(baseDate);
                    while (loopDate < targetDate) {
                        const loopStatus = checkHolidayStatus(loopDate, vacStart, vacEnd, holidayMap);
                        if (!loopStatus.isHoliday) {
                            schoolDaysCount++;
                        }
                        loopDate.setDate(loopDate.getDate() + 1);
                    }
                } else {
                    let loopDate = new Date(baseDate);
                    while (loopDate > targetDate) {
                        loopDate.setDate(loopDate.getDate() - 1);
                        const loopStatus = checkHolidayStatus(loopDate, vacStart, vacEnd, holidayMap);
                        if (!loopStatus.isHoliday) {
                            schoolDaysCount--;
                        }
                    }
                }

                // 🛠️ 변동 사항: 6/4 당일 순서가 '초록 모둠', '여자 먼저'가 되도록 배열 첫 번째(Index 0)에 배치
                const teams = ['초록 모둠', '파랑 모둠', '보라 모둠', '빨강 모둠', '노랑 모둠'];
                const lunch = ['여자 먼저 👧', '남자 먼저 👦'];

                if (manualTeamValue === "auto") {
                    const teamIdx = ((schoolDaysCount % teams.length) + teams.length) % teams.length;
                    currentTeam = teams[teamIdx];
                }
                if (manualLunchValue === "auto") {
                    const lunchIdx = ((schoolDaysCount % lunch.length) + lunch.length) % lunch.length;
                    currentLunch = lunch[lunchIdx];
                }
            }

            const teamElement = document.getElementById('today-team');
            teamElement.innerText = currentTeam;
            teamElement.className = "card-value color-" + currentTeam.split(' ')[0];

            const lunchElement = document.getElementById('lunch-order');
            lunchElement.innerText = currentLunch;
            lunchElement.className = "card-value gender-" + currentLunch.substring(0, 2);
        }

        updateDashboard();
    </script>
</body>
</html>
